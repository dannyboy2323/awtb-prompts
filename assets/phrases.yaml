# ADVENTURES WITH THE BULL
# Production Asset Library: Danny's Journal Phrases
# Version 1.0 — Final
#
# USAGE INSTRUCTIONS FOR STORY GENERATION:
#   - Draw from this library for the CLOSING LINES of Danny's journal entry
#     at the end of each story — the final paragraph where Danny writes
#     it all down
#   - Phrases may also be woven into Danny's narration voice throughout
#     the story — as internal thoughts, as lines from the journal Danny
#     recalls, or as the cadence of his prose
#   - These are NOT dedications (see intros.yaml) — they are the texture
#     of Danny's voice: what he says about Daniel when he is alone and
#     writing honestly
#   - Multiple phrases may be used per story — unlike dedications and
#     prison sayings, these are a voice library, not a one-per-story resource
#
# VOICE GUIDE:
#   These phrases are written by Danny to Daniel. First-person narrator,
#   addressing the son directly as "you." They carry the full range of
#   Danny's emotional register: guilt, wonder, pride, grief, love, humor,
#   and the specific ache of a man who missed years he can't get back.
#   The best ones are the ones that feel true rather than beautiful —
#   though many manage to be both.
#
# USE FOR:
#   - Closing lines of a journal entry
#   - Internal narration throughout a story
#   - Danny's spoken words to Daniel in quiet moments
#   - The letter-within-the-story register
#
# Total unique phrases: 1,329
# ─────────────────────────────────────────────────────────────────────────────

