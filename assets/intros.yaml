# ADVENTURES WITH THE BULL
# Production Asset Library: Story Dedications / Opening Blurbs
# Version 1.0 — Final
#
# USAGE INSTRUCTIONS FOR STORY GENERATION:
#   - Select ONE dedication per story — the opening line from Danny to Daniel
#   - Each dedication is used ONCE across the 1,500-story series — no repeats
#   - Mark used dedications in the pipeline tracker as consumed
#   - The dedication appears before the story begins and sets the entire
#     emotional register of what follows — choose it to match the story's
#     emotional center, not just its plot
#
# VOICE GUIDE:
#   Danny writes these as a man who has read Hemingway in a prison cell.
#   Spare. Earned. Never sentimental without cause. The best ones hit
#   before you know they've landed. Read the story first, then choose the
#   dedication that Danny would have reached for at 11pm, alone, writing
#   in his journal while Daniel slept.
#
# REGISTER CATEGORIES (for selection guidance):
#   [LOVE]        — Pure expressions of devotion and pride
#   [GUILT]       — Dedications that carry the weight of lost time
#   [IDENTITY]    — About Daniel as a person, his nature, who he is
#   [RETURN]      — About coming back, reunion, the long road home
#   [STRENGTH]    — Daniel's resilience, what he endured, what he became
#   [FRIENDSHIP]  — The best-friends dimension of their bond
#   [MYTHOS]      — The sacred/cosmic dimension of Daniel's nature
#   [NAMES]       — Dedications about shared names, legacy, Danny/Daniel
#
# Total unique dedications: 827
# ─────────────────────────────────────────────────────────────────────────────

