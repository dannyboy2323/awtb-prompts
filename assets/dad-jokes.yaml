# ADVENTURES WITH THE BULL
# Production Asset Library: Dad Jokes (Element 14)
# Version 1.1 — Nov 2026: author's 50-joke roundup folded in (each used once);
#   four internal near-duplicates from v1.0 removed; jokes matched to story hooks.
#
# WHAT THIS IS:
#   Starting with Story 3, every story contains exactly ONE corny dad joke told by
#   Danny in the present-day frame (the kitchen, the car, the driveway — never
#   inside the historical adventure unless the outline designates otherwise).
#   The dad joke is Element 14 of the story architecture. It is the one place in
#   the series where Danny is allowed to be deliberately, catastrophically
#   unfunny on purpose — and the series treats this as a sacred ritual.
#
# ORIGIN (canon, established Story 3):
#   The first joke came through a vent in the SHU — a man two cells down told it
#   to Danny in Year 2, and Danny waited five years for a kitchen to tell it in.
#   He will now tell one every Saturday for the rest of his life. Daniel will
#   suffer. That is the point.
#
# DELIVERY RULES:
#   - Danny tells the joke with the exact gravity he uses to quote a federal
#     sentencing guideline. He never smiles first. He pauses before the punchline.
#   - Daniel's reaction escalates across the series:
#       Stories 3-25:    "Dad." / "What." / "Don't."  — flat, pained, loyal
#       Stories 26-100:  Daniel starts rating them (out of ten). Most get a 2.
#       Stories 101-300: Daniel pre-empts them ("if you say 'grew on me' I'm leaving")
#       Stories 301-600: Daniel groans but repeats them to friends; is caught doing so
#       Stories 601+:    Daniel tells one back. Danny goes quiet. The journal notes it.
#   - Jenni laughs. Every time. The real laugh. This is one of the things Danny
#     will never be able to explain about her and never tries to.
#   - Jen, when present, closes her eyes the way Danny does for the prison jokes.
#   - Grandpa claims to have told Danny every one of them first. He has not.
#   - The joke is referenced ONCE in the journal entry, usually in a single clause,
#     and Danny never explains why he tells them. The reader works it out: a man
#     who lost five years of being annoying to his kid is making up the time.
#
# USAGE:
#   - One joke per story, by story number. No repeats across the series — not the
#     joke, and not the punchline either (no second "a stick", no second
#     "can't put it down").
#   - If the author supplies a joke in the story prompt, it overrides the indexed
#     entry; the indexed entry rolls forward to the next unassigned story and the
#     Dad Joke Deployment Log in timeline-continuity-bible.md is updated.
#   - Wording may be lightly tailored to Danny's mouth (e.g. #006 and #083 say
#     "my wife" — Danny says "a guy I knew" or hangs it on Jenni; the joke stays).
#     Prefer jokes that hook into something physically present in the scene.
#   - Designated exception stories (e.g. Story 13 / MLK) still contain the joke,
#     but it lives entirely in the pre-donut frame and is not mentioned again.
#   - The same jokes are printed in adventures.md under each story's
#     "The Dad Joke" field; this file is the index of record.
#
# CONSUMPTION STATUS:
#   003 📝 assigned (Story 3 outline — the facial-hair joke, author-supplied)
#   004-102 assigned by story number (planned, not yet written)
# -----------------------------------------------------------------------------

