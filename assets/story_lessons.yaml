reserve_lessons:
  RESERVE-A: "Patience at the right moment is more powerful than strength at the wrong one. The hardest skill is not acting — it is knowing when not to. [THEME: PREPARATION | formerly #5, Battle of Stirling Bridge 1297 — hold for a Wallace return (Falkirk 1298 recommended), Stories 101-300]"
